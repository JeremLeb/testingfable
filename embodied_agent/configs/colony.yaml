# A living colony: many creatures in one bigger shared world, foraging the same
# food, colliding, reproducing into live offspring, and evolving in place -- all
# driven by one shared "species brain". CPU-friendly small brain; `device: cuda`
# auto-uses your GPU when present.
#
#   python -m embodied_agent.colony.run --config colony
#   (or pick "Colony" in the GUI:  python -m embodied_agent.gui)
env:
  arena_size: 32.0            # a bigger map for a community
  n_food: 24                 # plenty of contested food
  food_energy: 0.4
  food_respawn_steps: 200
  n_obstacles: 4
  n_hot: 2
  n_cold: 2
  base_metabolism: 0.0010
sensor:
  vision_mode: rays
  n_rays: 16                 # shared body plan (all creatures see alike)
# each creature carries its OWN small brain, so keep the per-brain model tiny;
# it scales up on a GPU by raising these and n_max.
model:
  embed_dim: 64
  deter_dim: 64
  hidden: 64
  latent_kind: discrete
  latent_groups: 8
  latent_classes: 8
  reward_head: twohot
  reward_bins: 41
agent:
  horizon: 10
  expl_noise: 0.3
intrinsic:
  method: rnd
colony:
  n_init: 8
  n_max: 16
  n_min: 4
  shared_brain: false          # each creature is its own individual mind
  brain_inherit: true          # newborns inherit a copy of the parent's brain
  max_trains_per_step: 6       # cap minds trained per step (keeps it real-time)
  repro_energy_threshold: 0.70
  repro_rate: 0.005
  repro_cost: 0.30
  mutation_rate: 0.12
  creature_collision_damage: 0.03
train:
  total_steps: 300000
  seq_len: 24
  batch_size: 24
  log_every: 500
  gui_every: 6
  buffer_capacity: 20000        # per creature
  device: cuda
  out_dir: runs/colony
