# Laptop-CPU preset: tiny nets, short horizons, learning visible in minutes.
# Uses discrete categorical latents (small) + symlog two-hot reward, with the
# fast ray-cast vision. For the pixel retina on CPU, see cpu_pixels.yaml.
env:
  arena_size: 16.0
  max_episode_steps: 600
  n_food: 6
  food_radius: 0.45
  food_energy: 0.45
  n_obstacles: 2
model:
  embed_dim: 64
  deter_dim: 64
  hidden: 64
  latent_kind: discrete
  latent_groups: 8
  latent_classes: 8
  reward_head: twohot
  reward_bins: 41
agent:
  horizon: 8
train:
  total_steps: 20000
  warmup_steps: 1000
  seq_len: 16
  batch_size: 12
  train_every: 6
  log_every: 500
  eval_every: 4000
  gif_every: 10000
  device: cpu
  out_dir: runs/cpu_small
