# GPU preset: the full advanced stack -- pixel retina + CNN world model,
# large discrete categorical latents, symlog two-hot reward, long training.
env:
  arena_size: 24.0
  max_episode_steps: 1500
  n_food: 8
  n_obstacles: 4
sensor:
  vision_mode: pixels
  retina_res: 32
  retina_range: 9.0
model:
  embed_dim: 256
  deter_dim: 512
  hidden: 256
  cnn_depth: 32
  latent_kind: discrete
  latent_groups: 32
  latent_classes: 32
  unimix: 0.01
  reward_head: twohot
  reward_bins: 51
agent:
  horizon: 15
train:
  total_steps: 400000
  warmup_steps: 5000
  seq_len: 48
  batch_size: 32
  train_every: 4
  log_every: 1000
  eval_every: 20000
  gif_every: 50000
  buffer_capacity: 400000
  device: cuda
  out_dir: runs/gpu_default
